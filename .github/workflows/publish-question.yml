# Publish the weekly puzzle QUESTION post to Instagram (@deanzachessclub).
#
# Schedule: every Monday and Thursday at 09:00 America/Los_Angeles.
# 09:00 PST = 17:00 UTC, 09:00 PDT = 16:00 UTC, so the cron fires at both
# candidate UTC hours and scripts/publish.py's local-time guard picks the
# one that is actually 09:00 local (handles the DST change).
#
# The workflow: prepare (render image + caption) -> commit + push the
# rendered asset (the Graph API publishes from a public raw.githubusercontent
# URL, so the image must be on main first) -> post via the Graph API ->
# commit + push the queue update. If IG secrets are missing, `post`
# dry-runs by design and the queue is left untouched.

name: Publish weekly puzzle question

on:
  schedule:
    - cron: "0 16,17 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render + show manifest, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: puzzle-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare question post
        id: prepare
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/publish.py prepare --kind question --force
          else
            python scripts/publish.py prepare --kind question
          fi

      - name: Commit rendered asset
        if: steps.prepare.outputs.run == 'true'
        run: |
          git config user.name "chess-club-bot"
          git config user.email "chess-club-bot@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            NUM=$(python -c "import json; print(f\"{json.load(open('.publish/manifest.json'))['number']:03d}\")")
            git commit -m "Render weekly puzzle #${NUM} question image"
            git pull --rebase
            git push
          fi

      - name: Post to Instagram
        if: steps.prepare.outputs.run == 'true'
        run: python scripts/publish.py post --kind question

      - name: Commit queue update
        if: steps.prepare.outputs.run == 'true'
        run: |
          git config user.name "chess-club-bot"
          git config user.email "chess-club-bot@users.noreply.github.com"
          git add data/queue.json
          if ! git diff --cached --quiet; then
            NUM=$(python -c "import json; print(f\"{json.load(open('.publish/manifest.json'))['number']:03d}\")")
            git commit -m "Mark puzzle #${NUM} as posted"
            git pull --rebase
            git push
          fi
